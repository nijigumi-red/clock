<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>アナログ時計</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050a0f;
    --panel: #0a1520;
    --cm: #00e5ff;
    --cs: #ffb300;
    --gm: rgba(0,229,255,0.45);
    --gs: rgba(255,179,0,0.55);
    --bd: rgba(0,229,255,0.2);
    --sub: rgba(0,229,255,0.5);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100dvh;
    padding: 24px 16px 32px;
    position: relative;
  }

  /* 背景グリッド */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--bd) 1px, transparent 1px),
      linear-gradient(90deg, var(--bd) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  /* ビネット */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* 日付 */
  .date-box {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--bd);
    border-radius: 4px;
    padding: 12px 16px;
    text-align: center;
  }

  .date-txt {
    font-size: 20px;
    font-weight: 700;
    color: var(--cm);
    text-shadow: 0 0 10px var(--gm);
    letter-spacing: 1px;
  }

  .week-txt {
    font-size: 13px;
    font-weight: 400;
    color: var(--cs);
    letter-spacing: 4px;
    margin-top: 5px;
    text-shadow: 0 0 8px var(--gs);
  }

  /* アナログ時計 */
  .clock-box {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--bd);
    border-radius: 4px;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  canvas#clk { display: block; }

  /* デジタル */
  .digital-box {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--bd);
    border-radius: 4px;
    padding: 16px 10px;
    display: flex;
    align-items: baseline;
    justify-content: center;
  }

  .d-main {
    font-size: clamp(48px, 13vw, 64px);
    font-weight: 800;
    line-height: 1;
    color: var(--cm);
    text-shadow: 0 0 18px var(--gm), 0 0 50px rgba(0,229,255,0.15);
  }

  .d-colon {
    font-size: clamp(48px, 13vw, 64px);
    font-weight: 800;
    color: var(--cm);
    text-shadow: 0 0 18px var(--gm);
    padding: 0 2px;
  }

  .d-sec-sep {
    font-size: clamp(48px, 13vw, 64px);
    font-weight: 800;
    color: var(--cm);
    text-shadow: 0 0 18px var(--gm);
    padding: 0 2px;
  }

  .d-sec {
    font-size: clamp(42px, 11vw, 56px);
    font-weight: 900;
    color: var(--cs);
    text-shadow: 0 0 12px var(--gs);
  }

  /* 色設定パネル */
  .cpanel {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--bd);
    border-radius: 4px;
    padding: 12px 14px;
    display: none;
  }

  .cpanel.open { display: block; }

  .cp-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--sub);
    margin-bottom: 10px;
    text-align: center;
  }

  .cp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .cp-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cp-item label {
    font-size: 11px;
    color: rgba(0,229,255,0.6);
    letter-spacing: 1px;
    flex: 1;
    white-space: nowrap;
  }

  .cp-item input[type="color"] {
    width: 34px;
    height: 26px;
    border: 1px solid var(--bd);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 日付 -->
  <div class="date-box">
    <div class="date-txt" id="dateD">----/--/--</div>
    <div class="week-txt" id="weekD">---曜日</div>
  </div>

  <!-- アナログ時計 -->
  <div class="clock-box">
    <canvas id="clk" width="280" height="280"></canvas>
  </div>

  <!-- デジタル -->
  <div class="digital-box">
    <span class="d-main"><span id="dh">--</span><span class="d-colon">:</span><span id="dm">--</span></span>
    <span class="d-sec-sep">:</span>
    <span class="d-sec" id="ds">00</span>
  </div>

  <!-- 色設定パネル（長押し1秒で開閉） -->
  <div class="cpanel" id="cpanel">
    <div class="cp-title">COLOR SETTINGS</div>
    <div class="cp-grid">
      <div class="cp-item"><label>時・分針</label><input type="color" id="c-hm" value="#00e5ff"></div>
      <div class="cp-item"><label>秒針</label><input type="color" id="c-sp" value="#ffb300"></div>
      <div class="cp-item"><label>日付</label><input type="color" id="c-dt" value="#00e5ff"></div>
      <div class="cp-item"><label>曜日</label><input type="color" id="c-wk" value="#ffb300"></div>
    </div>
  </div>
</div>

<script>
const DAYS = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2, '0');
const root = document.documentElement;
const canvas = document.getElementById('clk');
const ctx = canvas.getContext('2d');
const R = 128, CX = 140, CY = 140;

let colorHM = '#00e5ff', colorSec = '#ffb300';

function hexToRgba(h, a) {
  const r = parseInt(h.slice(1,3), 16);
  const g = parseInt(h.slice(3,5), 16);
  const b = parseInt(h.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawClock() {
  const now = new Date();
  const H = now.getHours(), M = now.getMinutes(), S = now.getSeconds(), ms = now.getMilliseconds();
  const secF = S + ms / 1000;
  const minF = M + secF / 60;
  const hrF = H % 12 + minF / 60;

  ctx.clearRect(0, 0, 280, 280);

  // 外枠グロー
  ctx.save();
  ctx.shadowColor = hexToRgba(colorHM, 0.3);
  ctx.shadowBlur = 18;
  ctx.strokeStyle = colorHM;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // 外枠
  ctx.strokeStyle = hexToRgba(colorHM, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();

  // 目盛り
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI * 2 / 60 - Math.PI / 2;
    const isHour = i % 5 === 0;
    const outer = R - 2;
    const inner = isHour ? R - 14 : R - 7;
    ctx.save();
    ctx.strokeStyle = isHour ? hexToRgba(colorHM, 0.9) : hexToRgba(colorHM, 0.35);
    ctx.lineWidth = isHour ? 2.5 : 0.8;
    if (isHour) { ctx.shadowColor = hexToRgba(colorHM, 0.6); ctx.shadowBlur = 6; }
    ctx.beginPath();
    ctx.moveTo(CX + outer * Math.cos(a), CY + outer * Math.sin(a));
    ctx.lineTo(CX + inner * Math.cos(a), CY + inner * Math.sin(a));
    ctx.stroke();
    ctx.restore();
  }

  // 時数字（12・3・6・9）
  ctx.save();
  ctx.font = 'bold 16px "Noto Sans JP", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  [[12,0],[3,3],[6,6],[9,9]].forEach(([num, i]) => {
    const a = i * Math.PI * 2 / 12 - Math.PI / 2;
    const rd = R - 28;
    ctx.fillStyle = hexToRgba(colorHM, 0.85);
    ctx.shadowColor = hexToRgba(colorHM, 0.5);
    ctx.shadowBlur = 6;
    ctx.fillText(String(num), CX + rd * Math.cos(a), CY + rd * Math.sin(a));
  });
  ctx.restore();

  // 時針
  drawHand(hrF / 12 * Math.PI * 2 - Math.PI / 2, R * 0.56, 8, colorHM, 0.95, 12);
  // 分針
  drawHand(minF / 60 * Math.PI * 2 - Math.PI / 2, R * 0.80, 5, colorHM, 0.90, 8);

  // 秒針
  const secA = secF / 60 * Math.PI * 2 - Math.PI / 2;
  const nearZero = Math.min(secF, 60 - secF);
  const glow = nearZero < 3 ? 1 - (nearZero / 3) * 0.5 : 0.3;
  ctx.save();
  ctx.strokeStyle = colorSec;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = hexToRgba(colorSec, 0.8);
  ctx.shadowBlur = 10;
  const tail = R * 0.2;
  ctx.beginPath();
  ctx.moveTo(CX - tail * Math.cos(secA), CY - tail * Math.sin(secA));
  ctx.lineTo(CX + (R * 0.88) * Math.cos(secA), CY + (R * 0.88) * Math.sin(secA));
  ctx.stroke();
  ctx.shadowBlur = 20 * glow + 8;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CX + (R * 0.75) * Math.cos(secA), CY + (R * 0.75) * Math.sin(secA));
  ctx.lineTo(CX + (R * 0.95) * Math.cos(secA), CY + (R * 0.95) * Math.sin(secA));
  ctx.stroke();
  ctx.restore();

  // 中央ドット
  ctx.save();
  ctx.fillStyle = colorSec;
  ctx.shadowColor = hexToRgba(colorSec, 0.8);
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(CX, CY, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // デジタル更新
  document.getElementById('dateD').textContent = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;
  document.getElementById('weekD').textContent = `${DAYS[now.getDay()]}曜日`;
  document.getElementById('dh').textContent = pad(H);
  document.getElementById('dm').textContent = pad(M);
  document.getElementById('ds').textContent = pad(S);
}

function drawHand(angle, length, width, color, alpha, tipBlur) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.globalAlpha = alpha;
  ctx.shadowColor = hexToRgba(color, 0.6);
  ctx.shadowBlur = tipBlur;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + length * Math.cos(angle), CY + length * Math.sin(angle));
  ctx.stroke();
  ctx.restore();
}

function loop() { drawClock(); requestAnimationFrame(loop); }
loop();

// 色変更
document.getElementById('c-hm').addEventListener('input', e => {
  colorHM = e.target.value;
  root.style.setProperty('--cm', e.target.value);
  root.style.setProperty('--gm', hexToRgba(e.target.value, 0.45));
});
document.getElementById('c-sp').addEventListener('input', e => {
  colorSec = e.target.value;
  root.style.setProperty('--cs', e.target.value);
  root.style.setProperty('--gs', hexToRgba(e.target.value, 0.55));
});
document.getElementById('c-dt').addEventListener('input', e => {
  root.style.setProperty('--cm', e.target.value);
});
document.getElementById('c-wk').addEventListener('input', e => {
  root.style.setProperty('--cs', e.target.value);
});

// スクリーンスリープ防止
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}

// 長押し1秒で色設定パネル開閉
const cpanel = document.getElementById('cpanel');
let holdT = null;
function startHold() { holdT = setTimeout(() => { cpanel.classList.toggle('open'); if (navigator.vibrate) navigator.vibrate(40); }, 1000); }
function cancelHold() { clearTimeout(holdT); }
document.addEventListener('touchstart', startHold, { passive: true });
document.addEventListener('touchend', cancelHold);
document.addEventListener('touchmove', cancelHold);
document.addEventListener('mousedown', startHold);
document.addEventListener('mouseup', cancelHold);
</script>
</body>
</html>
